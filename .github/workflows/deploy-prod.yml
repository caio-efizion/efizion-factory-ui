name: Deploy Production UI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action_mode:
        description: "deploy or cleanup"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - cleanup

permissions:
  contents: read
  pull-requests: write

env:
  PROD_ROOT: /opt/efizion/prod/ui
  REPO_URL: https://github.com/${{ github.repository }}.git
  ACTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.action_mode || 'deploy' }}

jobs:
  deploy-prod:
    runs-on: [self-hosted, ui]
    environment:
      name: production
      url: https://ui.efizion.com.br/
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set production variables
        id: vars
        shell: bash
        run: |
          PROD_DIR="${{ env.PROD_ROOT }}"
          PROD_HOST="ui.efizion.com.br"
          CONTAINER="efizion-ui-prod"
          echo "prod_dir=$PROD_DIR" >> "$GITHUB_OUTPUT"
          echo "prod_host=$PROD_HOST" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "smoke_path=/" >> "$GITHUB_OUTPUT"
          echo "caddyfile_path=/root/caddy/Caddyfile" >> "$GITHUB_OUTPUT"
          echo "caddy_container=caddy" >> "$GITHUB_OUTPUT"
          echo "caddy_network=projeto-demo_efizion-net" >> "$GITHUB_OUTPUT"

      - name: Deploy or cleanup production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          PROD_DIR="${{ steps.vars.outputs.prod_dir }}"
          PROD_HOST="${{ steps.vars.outputs.prod_host }}"
          CONTAINER="${{ steps.vars.outputs.container }}"
          SMOKE_PATH="${{ steps.vars.outputs.smoke_path }}"
          CADDYFILE_PATH="${{ steps.vars.outputs.caddyfile_path }}"
          CADDY_CONTAINER="${{ steps.vars.outputs.caddy_container }}"
          CADDY_NETWORK="${{ steps.vars.outputs.caddy_network }}"
          BEGIN_MARKER="# BEGIN EFIZION PROD UI"
          END_MARKER="# END EFIZION PROD UI"

          mkdir -p "$PROD_DIR"

          if [ -d "$PROD_DIR/src/.git" ]; then
            cd "$PROD_DIR/src"
            git fetch --all --prune
            git checkout --force main
            git pull --rebase origin main
          else
            git clone "$REPO_URL" "$PROD_DIR/src"
            cd "$PROD_DIR/src"
            git checkout --force main
          fi

          if [ ! -d "$PROD_DIR/src/public" ]; then
            mkdir -p "$PROD_DIR/src/public"
          fi

          if [ "$ACTION_MODE" = "cleanup" ]; then
            if [ -f "$PROD_DIR/docker-compose.yml" ]; then
              cd "$PROD_DIR"
              docker compose down --remove-orphans || true
            fi
            echo "status=cleanup_ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "$PROD_DIR/docker-compose.yml" ]; then
            cp "$PROD_DIR/docker-compose.yml" "$PROD_DIR/docker-compose.yml.backup-$(date +%s)"
          fi

          {
            echo "services:"
            echo "  ui:"
            echo "    build:"
            echo "      context: ./src"
            echo "    container_name: ${CONTAINER}"
            echo "    restart: unless-stopped"
            echo "    networks:"
            echo "      - ${CADDY_NETWORK}"
            echo ""
            echo "networks:"
            echo "  ${CADDY_NETWORK}:"
            echo "    external: true"
          } > "$PROD_DIR/docker-compose.yml"

          cd "$PROD_DIR"
          echo "=== Starting production containers ==="
          docker compose down --remove-orphans || true
          docker compose up -d --build

          echo "=== Waiting 15s for app to be ready ==="
          sleep 15

          echo "=== Local smoke test ==="
          LOCAL_OK=0
          for i in {1..20}; do
            echo "Local attempt $i/20..."
            if docker exec "$CONTAINER" sh -c "wget -q -O- http://127.0.0.1:3000${SMOKE_PATH}" > /tmp/prod_ui_local.html 2>&1; then
              LOCAL_OK=1
              break
            fi
            sleep 3
          done

          if [ "$LOCAL_OK" -ne 1 ]; then
            echo "=== Local smoke failed ==="
            docker ps --filter name="$CONTAINER"
            docker logs "$CONTAINER" --tail 100 || true
            echo "status=failed:local" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "=== Configure Caddy route ==="
          awk -v b="$BEGIN_MARKER" -v e="$END_MARKER" '
            $0==b {skip=1; next}
            $0==e {skip=0; next}
            skip!=1 {print}
          ' "$CADDYFILE_PATH" > "${CADDYFILE_PATH}.tmp"
          mv "${CADDYFILE_PATH}.tmp" "$CADDYFILE_PATH"

          {
            echo ""
            echo "${BEGIN_MARKER}"
            echo "${PROD_HOST} {"
            echo "    reverse_proxy ${CONTAINER}:3000"
            echo "}"
            echo "${END_MARKER}"
          } >> "$CADDYFILE_PATH"

          docker exec "$CADDY_CONTAINER" caddy validate --config /etc/caddy/Caddyfile
          docker exec "$CADDY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile

          echo "=== Caddy route smoke test (local host header) ==="
          CADDY_OK=0
          HTTP_STATUS="000"
          for i in {1..30}; do
            echo "Caddy attempt $i/30..."
            HTTP_STATUS="$(curl -sS -o /tmp/prod_ui_caddy.html -w '%{http_code}' -H "Host: ${PROD_HOST}" http://127.0.0.1${SMOKE_PATH} || true)"
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "308" ]; then
              CADDY_OK=1
              break
            fi
            sleep 2
          done

          if [ "$CADDY_OK" -ne 1 ]; then
            echo "=== Caddy smoke failed ==="
            docker logs "$CADDY_CONTAINER" --tail 100 || true
            docker logs "$CONTAINER" --tail 100 || true
            echo "status=failed:caddy_http_${HTTP_STATUS}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=deploy_ok" >> "$GITHUB_OUTPUT"

      - name: Comment deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_STATUS: ${{ steps.deploy.outputs.status }}
          PROD_HOST: ${{ steps.vars.outputs.prod_host }}
          ACTION_MODE: ${{ env.ACTION_MODE }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const mode = process.env.ACTION_MODE || 'deploy';
            const status = process.env.DEPLOY_STATUS || 'unknown';
            const prodHost = process.env.PROD_HOST;

            let body;
            if (mode === 'cleanup') {
              body = `🧹 **Production cleanup (UI)**\n- Status: ${status}\n- Run: ${runUrl}`;
            } else if (status === 'deploy_ok') {
              body = `✅ **Production deployment successful (UI)**\n- URL: https://${prodHost}/\n- Run: ${runUrl}`;
            } else {
              body = `❌ **Production deployment failed (UI)**\n- Status: ${status}\n- Run: ${runUrl}\n- Action required: human review/rollback.`;
            }

            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha
            });

            if (prs.data.length > 0) {
              const pr = prs.data[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: context.sha,
                body
              });
            }
